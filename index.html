<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Two Sum Calc</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Two Sum Calculator</h1>

        <section id="display_array_area">
            <h2>Current Array</h2>

            <div id="array_container">
            </div>
        </section>

        <section id="alter_array_area">
            <h2>Modify Array</h2>

            <p>Enter a number:</p>
            <input type="number" id="number_input">

            <button id="push_button">Add number to array</button>
            <button id="pop_button">Pop number from array</button>
            <button id="clear_button">Clear array</button>
        </section>

        <section id="display_target_area">
            <h2>Target</h2>

            <p>Enter target value:</p>
            <input type="number" id="target_input_num">
        </section>

        <section id="display_result_area">
            <h2>Two Sum Result</h2>

            <p id="result" aria-live="polite">
                No result yet...
            </p>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
